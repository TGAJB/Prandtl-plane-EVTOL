<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="692" viewBox="0 0 1300 692" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#555555"/></marker><marker id="arrowRed" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#c0392b"/></marker></defs>
<rect x="0" y="0" width="1300" height="692" fill="#ffffff"/>
<text x="650.0" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#222222">eVTOL Sizing &amp; Optimisation — Runtime Pipeline</text>
<rect x="22" y="66" width="250" height="534.0" rx="12" fill="#fff2cc" stroke="#d6c36a"/>
<text x="147.0" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a6000">Inputs</text>
<text x="147.0" y="110" text-anchor="middle" font-size="12" font-style="italic" fill="#7a6000">read by every stage</text>
<rect x="38" y="128" width="218" height="87.0" rx="8" fill="#ffffff" stroke="#8a8a8a"/><text x="50.0" y="152.0" text-anchor="start" font-size="14" font-weight="bold" fill="#222222">Design inputs</text><text x="50.0" y="178.0" text-anchor="start" font-size="13" fill="#333333">geometry · masses ·</text><text x="50.0" y="199.0" text-anchor="start" font-size="13" fill="#333333">materials · constants</text>
<rect x="38" y="229" width="218" height="66.0" rx="8" fill="#ffffff" stroke="#8a8a8a"/><text x="50.0" y="253.0" text-anchor="start" font-size="14" font-weight="bold" fill="#222222">Matching diagram</text><text x="50.0" y="279.0" text-anchor="start" font-size="13" fill="#333333">W/S range, power &amp; CL limits</text>
<rect x="298" y="66" width="300" height="534.0" rx="12" fill="#fde9d9" stroke="#e0a884"/>
<text x="448.0" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#a64a26">Optimiser — NSGA-II (pymoo)</text>
<rect x="314" y="114" width="268" height="213.0" rx="8" fill="#ffffff" stroke="#8a8a8a"/><text x="326.0" y="138.0" text-anchor="start" font-size="14" font-weight="bold" fill="#222222">Searches 8 design variables</text><text x="326.0" y="164.0" text-anchor="start" font-size="12.5" fill="#333333">• front-wing fore/aft  (x_LEMAC_fw)</text><text x="326.0" y="185.0" text-anchor="start" font-size="12.5" fill="#333333">• front-wing height  (z_w_fw)</text><text x="326.0" y="206.0" text-anchor="start" font-size="12.5" fill="#333333">• wing loading  (W/S)</text><text x="326.0" y="227.0" text-anchor="start" font-size="12.5" fill="#333333">• aft/total area split  (S_aw/S_tot)</text><text x="326.0" y="248.0" text-anchor="start" font-size="12.5" fill="#333333">• vertical-tail span  (b_vtail)</text><text x="326.0" y="269.0" text-anchor="start" font-size="12.5" fill="#333333">• cruise battery x  (x_batt,cr)</text><text x="326.0" y="290.0" text-anchor="start" font-size="12.5" fill="#333333">• VTOL battery x  (x_batt,vtol)</text><text x="326.0" y="311.0" text-anchor="start" font-size="12.5" fill="#333333">• non-folding skin thickness  (t_nf)</text>
<rect x="314" y="341" width="268" height="108.0" rx="8" fill="#eaf5ea" stroke="#2e7d32" stroke-width="2"/><text x="448.0" y="365.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">NSGA-II population search</text><text x="326.0" y="391.0" text-anchor="start" font-size="13" font-weight="bold" fill="#222222">Objective functions:</text><text x="326.0" y="412.0" text-anchor="start" font-size="13" fill="#333333">↓ minimise mass (MTOW)</text><text x="326.0" y="433.0" text-anchor="start" font-size="13" fill="#333333">↑ maximise stability (margin)</text>
<rect x="314" y="463" width="268" height="87.0" rx="8" fill="#ffffff" stroke="#8a8a8a"/><text x="326.0" y="487.0" text-anchor="start" font-size="14" font-weight="bold" fill="#222222">Outputs (key values)</text><text x="326.0" y="513.0" text-anchor="start" font-size="13" fill="#333333">• chosen design + 8 tuned values</text><text x="326.0" y="534.0" text-anchor="start" font-size="13" fill="#333333">• written back to the inputs</text>
<rect x="624" y="66" width="258" height="534.0" rx="12" fill="#dbe9fb" stroke="#8fb6e6"/>
<text x="753.0" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5597">MTOW convergence loop</text>
<rect x="640" y="114" width="226" height="108.0" rx="8" fill="#ffffff" stroke="#8a8a8a"/><text x="652.0" y="138.0" text-anchor="start" font-size="14" font-weight="bold" fill="#222222">Damped fixed-point loop</text><text x="652.0" y="164.0" text-anchor="start" font-size="13" fill="#333333">guess weight → size all parts</text><text x="652.0" y="185.0" text-anchor="start" font-size="13" fill="#333333">→ re-sum → repeat until the</text><text x="652.0" y="206.0" text-anchor="start" font-size="13" fill="#333333">weight change is &lt; 1%</text>
<rect x="640" y="236" width="226" height="150.0" rx="8" fill="#ffffff" stroke="#8a8a8a"/><text x="652.0" y="260.0" text-anchor="start" font-size="14" font-weight="bold" fill="#222222">Sizes each pass:</text><text x="652.0" y="286.0" text-anchor="start" font-size="13" fill="#333333">• hover power</text><text x="652.0" y="307.0" text-anchor="start" font-size="13" fill="#333333">• wing + winglet (structure)</text><text x="652.0" y="328.0" text-anchor="start" font-size="13" fill="#333333">• fuselage · tail · landing gear</text><text x="652.0" y="349.0" text-anchor="start" font-size="13" fill="#333333">• motors · propellers + hubs</text><text x="652.0" y="370.0" text-anchor="start" font-size="13" fill="#333333">• battery</text>
<rect x="640" y="400" width="226" height="40.0" rx="8" fill="#eef5ff" stroke="#2f5597"/><text x="753.0" y="424.0" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2f5597">→ Converged MTOW</text>
<rect x="908" y="66" width="370" height="534.0" rx="12" fill="#d9eef1" stroke="#7fc0c9"/>
<text x="1093.0" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f6b75">Stability evaluation</text>
<rect x="924" y="114" width="338" height="87.0" rx="8" fill="#ffffff" stroke="#8a8a8a"/><text x="936.0" y="138.0" text-anchor="start" font-size="14" font-weight="bold" fill="#222222">Live aero (VLM)</text><text x="936.0" y="164.0" text-anchor="start" font-size="13" fill="#333333">lift slope, aero centre &amp; induced</text><text x="936.0" y="185.0" text-anchor="start" font-size="13" fill="#333333">drag computed from current geometry</text>
<rect x="924" y="215" width="338" height="66.0" rx="8" fill="#ffffff" stroke="#8a8a8a"/><text x="936.0" y="239.0" text-anchor="start" font-size="14" font-weight="bold" fill="#222222">Stability derivatives + neutral point</text><text x="936.0" y="265.0" text-anchor="start" font-size="13" fill="#333333">+ cruise / VTOL c.g. envelopes</text>
<rect x="924" y="295" width="338" height="245.0" rx="8" fill="#ffffff" stroke="#8a8a8a"/><text x="936.0" y="319.0" text-anchor="start" font-size="13" font-weight="bold" fill="#222222">Constraints required of the final design:</text><text x="936.0" y="340.0" text-anchor="start" font-size="13" fill="#333333">C_Mα &lt; 0    ·    C_Lq &gt; 0    ·    C_Mq &lt; 0</text><text x="936.0" y="361.0" text-anchor="start" font-size="13" fill="#333333">C_Yβ &lt; 0    ·    C_Lβ &lt; 0    ·    C_Nβ &gt; 0</text><text x="936.0" y="382.0" text-anchor="start" font-size="13" fill="#333333">C_Yp &lt; 0    ·    C_Lp &lt; 0    ·    C_Np &lt; 0</text><text x="936.0" y="403.0" text-anchor="start" font-size="13" fill="#333333">C_Yr &gt; 0    ·    C_Lr &gt; 0    ·    C_Nr &lt; 0</text><line x1="930" y1="417.0" x2="1256" y2="417.0" stroke="#dddddd" stroke-width="1"/><text x="936.0" y="440.0" text-anchor="start" font-size="13" fill="#333333">cruise c.g.:  x_fwd ≤ x_cg ≤ x_aft</text><text x="936.0" y="461.0" text-anchor="start" font-size="13" fill="#333333">VTOL OEI c.g.:  within allowable envelope</text><text x="936.0" y="482.0" text-anchor="start" font-size="13" fill="#333333">wing structure:  margin ≤ 0  (feasible)</text><text x="936.0" y="503.0" text-anchor="start" font-size="13" fill="#333333">power:  P_req ≤ P_installed</text><text x="936.0" y="524.0" text-anchor="start" font-size="13" fill="#333333">lift:  C_L,cruise ≤ C_L,max</text>
<path d="M852,148 a15,15 0 1 1 -7,-12" fill="none" stroke="#2f5597" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="924" y="554.0" width="338" height="30" rx="15" fill="#eaf5ea" stroke="#2e7d32"/>
<text x="1093.0" y="573.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b5e20">✓ all constraints met → design accepted</text>
<line x1="274" y1="333.0" x2="296" y2="333.0" stroke="#555555" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="285.0" y="324.0" text-anchor="middle" font-size="11.5" fill="#555555">search</text>
<text x="285.0" y="350.0" text-anchor="middle" font-size="11.5" fill="#555555">bounds</text>
<line x1="600" y1="333.0" x2="622" y2="333.0" stroke="#555555" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="611.0" y="324.0" text-anchor="middle" font-size="11.5" fill="#555555">design</text>
<text x="611.0" y="350.0" text-anchor="middle" font-size="11.5" fill="#555555">vector</text>
<line x1="884" y1="333.0" x2="906" y2="333.0" stroke="#555555" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="895.0" y="324.0" text-anchor="middle" font-size="11.5" fill="#555555">converged</text>
<text x="895.0" y="350.0" text-anchor="middle" font-size="11.5" fill="#555555">MTOW</text>
<path d="M1093.0,600.0 L1093.0,646.0 L448.0,646.0 L448.0,602.0" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="7,4" marker-end="url(#arrowRed)"/>
<text x="770.5" y="638.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c0392b">any constraint not met → optimiser proposes the next candidate (loop)</text>
</svg>
