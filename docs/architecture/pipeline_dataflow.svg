<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555555"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="560" fill="#ffffff"/>
  <text x="640" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#222222">eVTOL Sizing &amp; Optimisation &#8212; Runtime Pipeline</text>

  <!-- ================= COLUMN 1: INPUTS ================= -->
  <rect x="24" y="62" width="260" height="392" rx="12" fill="#fff2cc" stroke="#d6c36a"/>
  <text x="154" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a6000">Inputs</text>
  <text x="154" y="104" text-anchor="middle" font-size="10.5" font-style="italic" fill="#7a6000">read by every stage</text>

  <rect x="40" y="120" width="228" height="84" rx="8" fill="#ffffff" stroke="#8a8a8a"/>
  <text x="52" y="144" font-size="12" font-weight="bold" fill="#222222">Design inputs</text>
  <text x="52" y="166" font-size="11" fill="#333333">geometry &#183; masses &#183;</text>
  <text x="52" y="184" font-size="11" fill="#333333">materials &#183; constants</text>

  <rect x="40" y="218" width="228" height="62" rx="8" fill="#ffffff" stroke="#8a8a8a"/>
  <text x="52" y="242" font-size="12" font-weight="bold" fill="#222222">Matching diagram</text>
  <text x="52" y="262" font-size="11" fill="#333333">W/S range, power &amp; CL limits</text>

  <!-- ================= COLUMN 2: OPTIMISER ================= -->
  <rect x="348" y="62" width="260" height="392" rx="12" fill="#fde9d9" stroke="#e0a884"/>
  <text x="478" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#a64a26">Optimiser &#8212; NSGA-II (pymoo)</text>

  <rect x="364" y="104" width="228" height="130" rx="8" fill="#ffffff" stroke="#8a8a8a"/>
  <text x="376" y="126" font-size="12" font-weight="bold" fill="#222222">Tunes 7 design variables</text>
  <text x="376" y="148" font-size="11" fill="#333333">&#8226; front-wing position &amp; height</text>
  <text x="376" y="166" font-size="11" fill="#333333">&#8226; wing loading (W/S)</text>
  <text x="376" y="184" font-size="11" fill="#333333">&#8226; aft / total area split</text>
  <text x="376" y="202" font-size="11" fill="#333333">&#8226; vertical-tail span</text>
  <text x="376" y="220" font-size="11" fill="#333333">&#8226; cruise &amp; VTOL battery position</text>

  <rect x="364" y="246" width="228" height="74" rx="8" fill="#eaf5ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="478" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">NSGA-II population search</text>
  <text x="478" y="290" text-anchor="middle" font-size="11" fill="#333333">evolves designs toward the best</text>
  <text x="478" y="308" text-anchor="middle" font-size="11" fill="#333333">mass &#8211; stability trade-off</text>

  <rect x="364" y="332" width="228" height="98" rx="8" fill="#ffffff" stroke="#8a8a8a"/>
  <text x="376" y="354" font-size="12" font-weight="bold" fill="#222222">Outputs (key values)</text>
  <text x="376" y="376" font-size="11" fill="#333333">&#8226; Pareto front: MTOW vs stability</text>
  <text x="376" y="394" font-size="11" fill="#333333">&#8226; chosen design + 7 tuned values</text>
  <text x="376" y="412" font-size="11" fill="#333333">&#8226; values written back to inputs</text>

  <!-- ================= COLUMN 3: MTOW CONVERGENCE LOOP ================= -->
  <rect x="672" y="62" width="260" height="392" rx="12" fill="#dbe9fb" stroke="#8fb6e6"/>
  <text x="802" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5597">MTOW convergence loop</text>

  <rect x="688" y="104" width="228" height="88" rx="8" fill="#ffffff" stroke="#8a8a8a"/>
  <text x="700" y="126" font-size="12" font-weight="bold" fill="#222222">Damped fixed-point loop</text>
  <text x="700" y="148" font-size="11" fill="#333333">guess weight &#8594; size all parts</text>
  <text x="700" y="166" font-size="11" fill="#333333">&#8594; re-sum &#8594; repeat until the</text>
  <text x="700" y="184" font-size="11" fill="#333333">weight change is &lt; 1%</text>

  <rect x="688" y="206" width="228" height="124" rx="8" fill="#ffffff" stroke="#8a8a8a"/>
  <text x="700" y="228" font-size="12" font-weight="bold" fill="#222222">Sizes each pass:</text>
  <text x="700" y="250" font-size="11" fill="#333333">&#8226; hover power</text>
  <text x="700" y="268" font-size="11" fill="#333333">&#8226; wing + winglet (structure)</text>
  <text x="700" y="286" font-size="11" fill="#333333">&#8226; fuselage &#183; tail &#183; landing gear</text>
  <text x="700" y="304" font-size="11" fill="#333333">&#8226; motors &#183; propellers + hubs</text>
  <text x="700" y="322" font-size="11" fill="#333333">&#8226; battery</text>

  <rect x="688" y="344" width="228" height="44" rx="8" fill="#eef5ff" stroke="#2f5597"/>
  <text x="802" y="372" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5597">&#8594; Converged MTOW</text>

  <!-- iteration self-loop hint on the loop box -->
  <path d="M912,134 a14,14 0 1 1 -6,-11" fill="none" stroke="#2f5597" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ================= COLUMN 4: STABILITY EVALUATION ================= -->
  <rect x="996" y="62" width="260" height="392" rx="12" fill="#d9eef1" stroke="#7fc0c9"/>
  <text x="1126" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f6b75">Stability evaluation</text>

  <rect x="1012" y="104" width="228" height="78" rx="8" fill="#ffffff" stroke="#8a8a8a"/>
  <text x="1024" y="126" font-size="12" font-weight="bold" fill="#222222">Live aero (VLM)</text>
  <text x="1024" y="148" font-size="11" fill="#333333">lift slope, aero centre &amp;</text>
  <text x="1024" y="166" font-size="11" fill="#333333">induced drag from geometry</text>

  <rect x="1012" y="196" width="228" height="58" rx="8" fill="#ffffff" stroke="#8a8a8a"/>
  <text x="1024" y="220" font-size="12" font-weight="bold" fill="#222222">Stability derivatives</text>
  <text x="1024" y="240" font-size="11" fill="#333333">+ cruise / VTOL c.g. envelopes</text>

  <rect x="1012" y="268" width="228" height="132" rx="8" fill="#ffffff" stroke="#8a8a8a"/>
  <text x="1024" y="290" font-size="12" font-weight="bold" fill="#222222">Constraints checked:</text>
  <text x="1024" y="312" font-size="10.5" fill="#333333">&#8226; stiffness signs (C_M&#945;&lt;0, C_N&#946;&gt;0)</text>
  <text x="1024" y="330" font-size="10.5" fill="#333333">&#8226; cruise c.g. within limits</text>
  <text x="1024" y="348" font-size="10.5" fill="#333333">&#8226; VTOL one-engine-out c.g.</text>
  <text x="1024" y="366" font-size="10.5" fill="#333333">&#8226; wing structurally feasible</text>
  <text x="1024" y="384" font-size="10.5" fill="#333333">&#8226; power &amp; cruise-CL feasible</text>

  <rect x="1012" y="412" width="228" height="28" rx="14" fill="#eaf5ea" stroke="#2e7d32"/>
  <text x="1126" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">&#10003; all met &#8594; design accepted</text>

  <!-- ================= FORWARD FLOW ARROWS ================= -->
  <line x1="284" y1="258" x2="346" y2="258" stroke="#555555" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="316" y="246" text-anchor="middle" font-size="10" fill="#555555">search</text>
  <text x="316" y="272" text-anchor="middle" font-size="10" fill="#555555">bounds</text>

  <line x1="608" y1="258" x2="670" y2="258" stroke="#555555" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="640" y="246" text-anchor="middle" font-size="10" fill="#555555">design</text>
  <text x="640" y="272" text-anchor="middle" font-size="10" fill="#555555">vector</text>

  <line x1="932" y1="258" x2="994" y2="258" stroke="#555555" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="963" y="246" text-anchor="middle" font-size="10" fill="#555555">converged</text>
  <text x="963" y="272" text-anchor="middle" font-size="10" fill="#555555">MTOW</text>

  <!-- ================= FEEDBACK (constraint not met -> next candidate) ================= -->
  <path d="M1126,454 L1126,506 L478,506 L478,456" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="7,4" marker-end="url(#arrowRed)"/>
  <text x="802" y="500" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#c0392b">any constraint not met &#8594; optimiser proposes the next candidate (loop)</text>
</svg>
